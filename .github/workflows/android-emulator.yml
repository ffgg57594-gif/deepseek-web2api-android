name: Android Emulator Functional Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=AndroidHarness"

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Install Android SDK command-line tools
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses and install components
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "platforms;android-30" "build-tools;34.0.0" "system-images;android-30;google_apis;x86_64" "emulator"

      - name: Build debug APK
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== Gradle attempt $attempt ==="
            if gradle assembleDebug --stacktrace --no-daemon; then
              echo "BUILD SUCCEEDED on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; sleeping before retry..."
            sleep $((attempt * 30))
          done
          echo "All build attempts failed"
          exit 1

      - name: Create Android Emulator (API 30)
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          echo "y" | /opt/android-sdk/cmdline-tools/latest/bin/avdmanager create avd \
            -n test_avd \
            -k "system-images;android-30;google_apis;x86_64" \
            -g google_apis \
            -d pixel_6

      - name: Start Android Emulator
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          nohup /opt/android-sdk/emulator/emulator -avd test_avd \
            -no-snapshot -no-window -no-audio -no-boot-anim \
            -qemu -enable-kvm -m 1536 > emulator.log 2>&1 &
          echo "Emulator started, waiting for boot (up to 5 minutes)..."
          for i in $(seq 1 60); do
            if /opt/android-sdk/platform-tools/adb wait-for-device shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "Emulator booted successfully"
              exit 0
            fi
            sleep 5
          done
          echo "Emulator failed to boot within 5 minutes"
          cat emulator.log
          exit 1

      - name: Install debug APK on emulator
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          /opt/android-sdk/platform-tools/adb wait-for-device
          /opt/android-sdk/platform-tools/adb install -r -t app/build/outputs/apk/debug/app-debug.apk

      - name: Forward port 8080 for local API testing
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          /opt/android-sdk/platform-tools/adb reverse tcp:8080 tcp:8080

      - name: Run instrumented tests
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
          DEEPSEEK_AUTH_TOKEN: ${{ secrets.DEEPSEEK_AUTH_TOKEN }}
          DEEPSEEK_COOKIE: ${{ secrets.DEEPSEEK_COOKIE }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Test attempt $attempt ==="
            if gradle connectedAndroidTest --stacktrace --no-daemon; then
              echo "TESTS SUCCEEDED on attempt $attempt"
              exit 0
            fi
            echo "Test attempt $attempt failed; sleeping before retry..."
            sleep $((attempt * 20))
          done
          echo "All test attempts failed"
          exit 1

      - name: Pull logcat on failure
        if: failure()
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          /opt/android-sdk/platform-tools/adb logcat -d > logcat_failure.txt 2>/dev/null || true
          echo "Logcat saved"

      - name: Upload test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
            logcat_failure.txt
