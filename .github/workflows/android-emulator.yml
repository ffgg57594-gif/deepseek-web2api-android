name: Android Emulator Functional Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-functional-tests:
    name: Android Emulator Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Regenerate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          sh -n gradlew && echo "gradlew syntax OK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM device
        run: ls -l /dev/kvm

      - name: Prepare secrets (Base64 encode cookies, mask in logs)
        env:
          DEEPSEEK_COOKIES: ${{ secrets.deepseek_cookies }}
        run: |
          B64=$(printf '%s' "$DEEPSEEK_COOKIES" | base64 -w0)
          echo "::add-mask::$B64"
          echo "DEEPSEEK_COOKIES_B64=$B64" >> "$GITHUB_ENV"

      - name: Install Android SDK command-line tools
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses and install components
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-29" "build-tools;34.0.0" "system-images;android-29;default;x86_64" "emulator"

      - name: Run Android Emulator and Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        env:
          DEEPSEEK_TOKEN: ${{ secrets.deepseek_token }}
          DEEPSEEK_COOKIES_B64: ${{ env.DEEPSEEK_COOKIES_B64 }}
        script: |
          ./gradlew connectedAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.deepseekToken="$DEEPSEEK_TOKEN" \
            -Pandroid.testInstrumentationRunnerArguments.deepseekCookiesB64="$DEEPSEEK_COOKIES_B64" \
            --stacktrace --no-daemon

      - name: Pull logcat on failure
        if: failure()
        run: |
          adb logcat -d > logcat_failure.txt 2>/dev/null || true

      - name: Upload test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
            logcat_failure.txt
          retention-days: 7
