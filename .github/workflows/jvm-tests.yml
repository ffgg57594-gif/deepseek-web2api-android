name: JVM Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-unit-tests:
    name: JVM Unit Tests (no emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: "deepseek cookies"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Install Android SDK command-line tools
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK licenses and install components
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Regenerate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          sh -n gradlew && echo "gradlew syntax OK"

      - name: Compile JVM unit tests
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          gradle compileDebugUnitTestKotlin --stacktrace --info --no-daemon

      - name: Run JVM unit tests (PowSolver, SseParser, KtorServer, AccountRepository)
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
          deepseek_token: ${{ secrets.deepseek_token }}
          deepseek_cookies: ${{ secrets.deepseek_cookies }}
        run: |
          echo "Secret availability check (from environment 'deepseek cookies'):"
          echo "deepseek_token available: $([ -n \"\$deepseek_token\" ] && echo 'YES' || echo 'NO')"
          echo "deepseek_token length: ${#deepseek_token}"
          echo "deepseek_cookies available: $([ -n \"\$deepseek_cookies\" ] && echo 'YES' || echo 'NO')"
          echo "deepseek_cookies length: ${#deepseek_cookies}"
          gradle testDebugUnitTest --stacktrace --info --continue --no-daemon

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: app/build/reports/tests/test/**
          retention-days: 7
